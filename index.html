<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Projetos</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />


</head>

<body>

  <div class="bg">
    <div class="grid-floor"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <div class="orb orb5"></div>
  </div>

  <div class="screen">
    <div class="select-header">
      <div class="eyebrow">// system / memory card</div>
      <h1>Meus <span>Projetos</span></h1>
    </div>

    <div class="cards-wrap" id="cardsWrap">
      <!-- Cards serão gerados pelo JS -->
    </div>

    <div class="select-footer">
      Clique em um card para ver os projetos
    </div>
  </div>
  <script src="projects.js"></script>
  <script>
    // =========================================================
    // GERA OS MEMORY CARDS DINAMICAMENTE
    // =========================================================
    const cardsWrap = document.getElementById('cardsWrap');

    bimestres.forEach(b => {
      const count = projects.filter(p => p.bimestre === b.id).length;
      const card = document.createElement('a');
      card.className = 'memcard';
      card.href = `bimestre.html?id=${b.id}`;
      card.style.setProperty('--mc-a', b.colorA);
      card.style.setProperty('--mc-b', b.colorB);
      card.innerHTML = `
        <div class="mc-icon">${b.icon}</div>
        <div class="mc-bimestre">Memory Card</div>
        <div class="mc-title">${b.title}</div>
        <div class="mc-count">${count} projeto${count !== 1 ? 's' : ''}</div>
      `;
      cardsWrap.appendChild(card);
    });
  </script>

</body>

</html>
